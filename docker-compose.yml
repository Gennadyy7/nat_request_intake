  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: fastapi_backend
    depends_on:
      app_postgres:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      # Must match NAT_UPLOAD_BASE_DIR.
      - nat_uploads:/app/backend/uploads/nat
      # Must match SPIN_AGGREGATED_BASE_DIR.
      - ${SPIN_AGGREGATED_HOST_DIR}:/app/data/aggregated
      # Must match ASSOMI_BASE_DIR (shared with assomi_worker; API reads CSV artifacts).
      - ${ASSOMI_HOST_DIR}:/app/data/assomi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keycloak_network

  email_poller:
    build:
      context: .
      dockerfile: Dockerfile.email_poller
    container_name: email_poller_service
    depends_on:
      app_postgres:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy
      fastapi_app:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

  nat_task_status_worker:
    build:
      context: .
      dockerfile: Dockerfile.nat_task_status_worker
    container_name: nat_task_status_worker_service
    depends_on:
      app_postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

  nat_batch_notify_worker:
    build:
      context: .
      dockerfile: Dockerfile.nat_batch_notify_worker
    container_name: nat_batch_notify_worker_service
    depends_on:
      app_postgres:
        condition: service_healthy
    ports:
      - "8003:8003"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

  assomi_worker:
    build:
      context: .
      dockerfile: Dockerfile.assomi_worker
    container_name: assomi_worker_service
    depends_on:
      app_postgres:
        condition: service_healthy
    ports:
      - "8004:8004"
    env_file:
      - ./.env
    volumes:
      # Read SPIN-matched artifacts (same tree as aggregator / fastapi_app).
      - ${SPIN_AGGREGATED_HOST_DIR}:/app/data/aggregated:ro
      # Write ASSOMI CSV artifacts.
      - ${ASSOMI_HOST_DIR}:/app/data/assomi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

  intake_result_email_worker:
    build:
      context: .
      dockerfile: Dockerfile.intake_result_email_worker
    container_name: intake_result_email_worker_service
    depends_on:
      app_postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    env_file:
      - ./.env
    volumes:
      # Read ASSOMI CSV artifacts for email attachments (same tree as assomi_worker).
      - ${ASSOMI_HOST_DIR}:/app/data/assomi:ro
      # combined_xlsx attachments also read NAT uploads and SPIN artifacts.
      - nat_uploads:/app/backend/uploads/nat:ro
      - ${SPIN_AGGREGATED_HOST_DIR}:/app/data/aggregated:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

volumes:
#  postgres_data:
  app_postgres_data:
  nat_uploads:

networks:
  keycloak_network:
    driver: bridge
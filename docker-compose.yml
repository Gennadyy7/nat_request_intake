  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: fastapi_backend
    depends_on:
      app_postgres:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - nat_uploads:/app/backend/uploads/nat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - keycloak_network

  email_poller:
    build:
      context: .
      dockerfile: Dockerfile.email_poller
    container_name: email_poller_service
    depends_on:
      app_postgres:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy
      fastapi_app:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

  nat_task_status_worker:
    build:
      context: .
      dockerfile: Dockerfile.nat_task_status_worker
    container_name: nat_task_status_worker_service
    depends_on:
      app_postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - keycloak_network

volumes:
#  postgres_data:
  app_postgres_data:
  nat_uploads:

networks:
  keycloak_network:
    driver: bridge